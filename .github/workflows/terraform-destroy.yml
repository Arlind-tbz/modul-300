name: Destroy Terraform Infrastructure

on:
  schedule:
    - cron: '30 17 * * 0'
    - cron: '30 17 * * 1'
    - cron: '30 18 * * 2'
    - cron: '30 17 * * 3'
    - cron: '30 17 * * 4'
    - cron: '30 17 * * 5'
    - cron: '30 17 * * 6'
  workflow_dispatch:

permissions:
  contents: read

env:
  ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
  ARM_CLIENT_ID:       ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
  ARM_CLIENT_SECRET:   ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
  ARM_TENANT_ID:       ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

jobs:
  destroy-infra:
    name: Destroy Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init (infra)
        working-directory: ./src/infrastructure
        run: |
          terraform init \
            -backend-config="resource_group_name=terraform-storage-rg" \
            -backend-config="storage_account_name=tfstatearlindsulejmani" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=infrastructure.tfstate"

      - name: Terraform Destroy (infra)
        working-directory: ./src/infrastructure
        run: |
          terraform destroy \
            -var "subscription_id=${{ env.ARM_SUBSCRIPTION_ID }}" \
            -var "tenant_id=${{ env.ARM_TENANT_ID }}" \
            -auto-approve

      - name: Commit Formatting & Lockfile Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: terraform fmt and lockfile update"
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git push origin HEAD:main
          fi

  destroy-backend:
    name: Destroy Backend Resources
    runs-on: ubuntu-latest
    needs: destroy-infra

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init (backend)
        working-directory: ./src/storage
        run: terraform init
      - name: Terraform Import Resources
        working-directory: ./src/storage
        run: |
          terraform import \
            -var "ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" \
            -var "subscription_id=${{ env.ARM_SUBSCRIPTION_ID }}" \
            -var "tenant_id=${{ env.ARM_TENANT_ID }}" \
            azurerm_resource_group.storage_rg \
            "/subscriptions/${{ env.ARM_SUBSCRIPTION_ID }}/resourceGroups/terraform-storage-rg" || echo "Resource group not found"

          terraform import \
            -var "ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" \
            -var "subscription_id=${{ env.ARM_SUBSCRIPTION_ID }}" \
            -var "tenant_id=${{ env.ARM_TENANT_ID }}" \
            azurerm_storage_account.tfstate \
            "/subscriptions/${{ env.ARM_SUBSCRIPTION_ID }}/resourceGroups/terraform-storage-rg/providers/Microsoft.Storage/storageAccounts/tfstatearlindsulejmani" || echo "Storage account not found"

          terraform import \
            -var "ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" \
            -var "subscription_id=${{ env.ARM_SUBSCRIPTION_ID }}" \
            -var "tenant_id=${{ env.ARM_TENANT_ID }}" \
            azurerm_storage_container.tfstate \
            "/subscriptions/${{ env.ARM_SUBSCRIPTION_ID }}/resourceGroups/terraform-storage-rg/providers/Microsoft.Storage/storageAccounts/tfstatearlindsulejmani/blobServices/default/containers/tfstate" || echo "Storage container not found"

          terraform import \
            -var "ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" \
            -var "subscription_id=${{ env.ARM_SUBSCRIPTION_ID }}" \
            -var "tenant_id=${{ env.ARM_TENANT_ID }}" \
            azurerm_key_vault.tfvars \
            "/subscriptions/${{ env.ARM_SUBSCRIPTION_ID }}/resourceGroups/terraform-storage-rg/providers/Microsoft.KeyVault/vaults/arlindsulejmanitfvars" || echo "Key Vault not found"

          ssh_uri=$(az keyvault secret list-versions \
            --vault-name arlindsulejmanitfvars \
            --name ssh-public-key \
            --query "[].id" \
            --output tsv | head -n1 || true)

          if [[ -n "$ssh_uri" ]]; then
            terraform import \
              -var "ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" \
              -var "subscription_id=${{ env.ARM_SUBSCRIPTION_ID }}" \
              -var "tenant_id=${{ env.ARM_TENANT_ID }}" \
              azurerm_key_vault_secret.ssh_public_key "$ssh_uri"
          fi

          startup_uri=$(az keyvault secret list-versions \
            --vault-name arlindsulejmanitfvars \
            --name startup-script \
            --query "[].id" \
            --output tsv | head -n1 || true)

          if [[ -n "$startup_uri" ]]; then
            terraform import \
              -var "ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" \
              -var "subscription_id=${{ env.ARM_SUBSCRIPTION_ID }}" \
              -var "tenant_id=${{ env.ARM_TENANT_ID }}" \
              azurerm_key_vault_secret.startup_script "$startup_uri"
          fi

      - name: Terraform Destroy (backend)
        working-directory: ./src/storage
        run: |
          terraform destroy \
            -var "ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" \
            -var "subscription_id=${{ env.ARM_SUBSCRIPTION_ID }}" \
            -var "tenant_id=${{ env.ARM_TENANT_ID }}" \
            -auto-approve

      - name: Commit Formatting & Lockfile Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: terraform fmt and lockfile update"
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git push origin HEAD:main
          fi
