name: Deploy Terraform changes to Azure

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
  ARM_CLIENT_ID:       ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
  ARM_CLIENT_SECRET:   ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
  ARM_TENANT_ID:       ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure CLI Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        working-directory: ./src/storage
        run: terraform init

      - name: Terraform Import
        working-directory: ./src/storage
        run: |
          echo "Importing resource group..."
          terraform import \
            -var "ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" \
            -var "subscription_id=${{ env.ARM_SUBSCRIPTION_ID }}" \
            -var "tenant_id=${{ env.ARM_TENANT_ID }}" \
            azurerm_resource_group.storage_rg \
            "/subscriptions/${{ env.ARM_SUBSCRIPTION_ID }}/resourceGroups/terraform-storage-rg" || echo "Resource group not found for import (may be new)"

          echo "Importing Key Vault..."
          terraform import \
            -var "ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" \
            -var "subscription_id=${{ env.ARM_SUBSCRIPTION_ID }}" \
            -var "tenant_id=${{ env.ARM_TENANT_ID }}" \
            azurerm_key_vault.tfvars \
            "/subscriptions/${{ env.ARM_SUBSCRIPTION_ID }}/resourceGroups/terraform-storage-rg/providers/Microsoft.KeyVault/vaults/arlindsulejmanitfvars" || echo "Key Vault not found or already imported"

          echo "Fetching latest version of ssh-public-key..."
          ssh_uri=$(az keyvault secret list-versions \
            --vault-name arlindsulejmanitfvars \
            --name ssh-public-key \
            --query "[].id" \
            --output tsv | head -n1 || true)

          if [[ -n "$ssh_uri" ]]; then
            echo "Importing ssh-public-key version: $ssh_uri"
            terraform import \
              -var "ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" \
              -var "subscription_id=${{ env.ARM_SUBSCRIPTION_ID }}" \
              -var "tenant_id=${{ env.ARM_TENANT_ID }}" \
              azurerm_key_vault_secret.ssh_public_key "$ssh_uri"
          else
            echo "🔎 ssh-public-key not found, skipping import"
          fi

          echo "Fetching latest version of startup-script..."
          startup_uri=$(az keyvault secret list-versions \
            --vault-name arlindsulejmanitfvars \
            --name startup-script \
            --query "[].id" \
            --output tsv | head -n1 || true)

          if [[ -n "$startup_uri" ]]; then
            echo "Importing startup-script version: $startup_uri"
            terraform import \
              -var "ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" \
              -var "subscription_id=${{ env.ARM_SUBSCRIPTION_ID }}" \
              -var "tenant_id=${{ env.ARM_TENANT_ID }}" \
              azurerm_key_vault_secret.startup_script "$startup_uri"
          else
            echo "🔎 startup-script not found, skipping import"
          fi

      - name: Terraform Plan
        working-directory: ./src/storage
        run: |
          terraform plan \
            -var "ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" \
            -var "subscription_id=${{ env.ARM_SUBSCRIPTION_ID }}" \
            -var "tenant_id=${{ env.ARM_TENANT_ID }}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: ./src/storage
        run: |
          terraform apply \
            -var "ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" \
            -var "subscription_id=${{ env.ARM_SUBSCRIPTION_ID }}" \
            -var "tenant_id=${{ env.ARM_TENANT_ID }}" \
            -auto-approve tfplan

      - name: Terraform Fmt & Lockfile Update
        working-directory: ./src/storage
        run: |
          terraform fmt -recursive
          terraform init -lockfile=./.terraform.lock.hcl

      - name: Commit fmt & lockfile changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: terraform fmt and lockfile update"
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git push origin HEAD:main
          fi

  deploy-infra:
    runs-on: ubuntu-latest
    name: Deploy Infrastructure
    needs: backend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init with Backend Config
        working-directory: ./src/infrastructure
        run: |
          terraform init \
            -backend-config="resource_group_name=terraform-storage-rg" \
            -backend-config="storage_account_name=tfstatearlindsulejmani" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=infrastructure.tfstate"

      - name: Terraform Plan
        working-directory: ./src/infrastructure
        run: |
          terraform plan \
            -var "subscription_id=${{ env.ARM_SUBSCRIPTION_ID }}" \
            -var "tenant_id=${{ env.ARM_TENANT_ID }}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: ./src/infrastructure
        run: |
          terraform apply \
            -var "subscription_id=${{ env.ARM_SUBSCRIPTION_ID }}" \
            -var "tenant_id=${{ env.ARM_TENANT_ID }}" \
            -auto-approve tfplan

      - name: Terraform Fmt & Lockfile Update
        working-directory: ./src/infrastructure
        run: |
          terraform fmt -recursive
          terraform init -lockfile=./.terraform.lock.hcl

      - name: Commit fmt & lockfile changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: terraform fmt and lockfile update"
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git push origin HEAD:main
          fi
