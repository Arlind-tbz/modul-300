name: Deploy Terraform changes to Azure

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest

    env:
      ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
      ARM_CLIENT_ID:       ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
      ARM_CLIENT_SECRET:   ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
      ARM_TENANT_ID:       ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure CLI Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Import latest Key Vault secrets into Terraform state
        working-directory: ./src/storage
        run: |
          set -euo pipefail
          set -x  # Show commands as they run

          echo "Importing resource group..."
          terraform import azurerm_resource_group.storage_rg "/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/terraform-storage-rg"

          echo "Fetching latest version of ssh-public-key (single-version safe)"
          secret_versions=$(az keyvault secret list-versions \
            --vault-name arlindsulejmanitfvars \
            --name ssh-public-key \
            --query "[].id" \
            --output tsv)

          if [[ -z "$secret_versions" ]]; then
            echo "No versions found for ssh-public-key!"
            exit 1
          fi

          # Get the only version (or first one if more)
          ssh_id=$(echo "$secret_versions" | head -n1)

          echo "Importing ssh-public-key from: $ssh_id"
          terraform import azurerm_key_vault_secret.ssh_public_key "$ssh_id"

          echo "Fetching latest version of startup-script"
          startup_versions=$(az keyvault secret list-versions \
            --vault-name arlindsulejmanitfvars \
            --name startup-script \
            --query "[].id" \
            --output tsv)

          if [[ -z "$startup_versions" ]]; then
            echo "No versions found for startup-script!"
            exit 1
          fi

          startup_id=$(echo "$startup_versions" | head -n1)

          echo "Importing startup-script from: $startup_id"
          terraform import azurerm_key_vault_secret.startup_script "$startup_id"

      - name: Terraform Init
        working-directory: ./src/storage
        run: terraform init

      - name: Terraform Plan
        working-directory: ./src/storage
        run: |
          terraform plan \
            -var "ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" \
            -out=tfplan

  deploy-infra:
    runs-on: ubuntu-latest
    name: Deploy Infrastructure
    needs: backend
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        working-directory: ./src/terraform
        env:
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: ./src/terraform
        env:
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
        run: |
          terraform plan \
            -var "ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: ./src/terraform
        env:
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
        run: terraform apply -auto-approve tfplan

      - name: Terraform Fmt & Lockfile Update
        working-directory: ./src/terraform
        run: |
          terraform fmt -recursive
          terraform init -lockfile=./.terraform.lock.hcl

      - name: Commit fmt & lockfile changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: terraform fmt and lockfile update"
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git push origin HEAD:main
          fi
