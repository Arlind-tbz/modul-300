  deploy-infra:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
#    needs:
#      - deploy-backend
#      - build-frontend
#      - build-backend
#      - build-db

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set Up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Mask Secrets
        run: |
          echo "::add-mask::${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}"
          echo "::add-mask::${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}"
          echo "::add-mask::${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}"
          echo "::add-mask::${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}"

      - name: Terraform Init
        working-directory: ./src/terraform/infrastructure
        env:
          STORAGE_RG_NAME: terraform-storage-rg
          STORAGE_ACCOUNT_NAME: tfstatearlindsulejmani
        run: |
          terraform init \
            -backend-config="resource_group_name=$STORAGE_RG_NAME" \
            -backend-config="storage_account_name=$STORAGE_ACCOUNT_NAME" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=infrastructure.tfstate"

      - name: Generate terraform.tfvars
        working-directory: ./src/terraform/infrastructure
        env:
          SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
        run: |
          echo subscription_id=\"$SUBSCRIPTION_ID\"       >  terraform.tfvars
          echo tenant_id=\"$TENANT_ID\"                   >> terraform.tfvars

      - name: Import Microsoft.App Resource Provider
        working-directory: ./src/terraform/infrastructure
        env:
          SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
        run: |
          terraform import \
            azurerm_resource_provider_registration.container_apps \
            "/subscriptions/$SUBSCRIPTION_ID/providers/Microsoft.App" || echo "Microsoft.App already registered or import failed"

      - name: Discover & Import Backup Protected File Share
        working-directory: ./src/terraform/infrastructure
        env:
          SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          RESOURCE_GROUP: "terraform-infrastructure-rg"
          VAULT_NAME: "arlindapp-vault"
          STORAGE_ACCOUNT: "arlindappmysqlsa"
          FILE_SHARE_NAME: "mysql-data"
        run: |
          echo "Ensuring storage container is discovered..."

          container_name="StorageContainer;Storage;$RESOURCE_GROUP;$STORAGE_ACCOUNT"

          # Step 1: Trigger the inquiry
          az backup protection check-protection-intent \
            --resource-group "$RESOURCE_GROUP" \
            --vault-name "$VAULT_NAME" \
            --backup-management-type AzureStorage \
            --name "$container_name" || true

          echo "Waiting for inquiry to complete..."
          sleep 20

          echo "Attempting to discover and import backup-protected file share..."

          # Build the full resource ID
          storage_account_id="/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.Storage/storageAccounts/$STORAGE_ACCOUNT"

          # Fetch the backup item ID
          file_share_id=$(az backup item list \
            --resource-group "$RESOURCE_GROUP" \
            --vault-name "$VAULT_NAME" \
            --workload-type "AzureFileShare" \
            --query "[?properties.sourceResourceId=='$storage_account_id' && properties.friendlyName=='$FILE_SHARE_NAME'].id" \
            --output tsv | head -n1 || true)

          echo "Backup item ID: $file_share_id"

          if [[ -n "$file_share_id" ]]; then
            echo "Found backup item. Importing into Terraform..."
            terraform state show azurerm_backup_protected_file_share.mysql_data_backup >/dev/null 2>&1 || \
            terraform import azurerm_backup_protected_file_share.mysql_data_backup "$file_share_id"
          else
            echo "File share backup not found or not yet registered in the vault."
          fi

      - name: Terraform Validate
        working-directory: ./src/terraform/infrastructure
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./src/terraform/infrastructure
        env:
          SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
        run: |
          terraform plan \
            -out=tfplan

      - name: Terraform Apply
        working-directory: ./src/terraform/infrastructure
        env:
          SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
        run: |
          terraform apply \
            -auto-approve tfplan

      - name: Output Frontend URL to Summary
        working-directory: ./src/terraform/infrastructure
        run: |
          FRONTEND_URL=$(terraform output -raw frontend_url)
          echo "## Frontend Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend URL:** [$FRONTEND_URL](https://$FRONTEND_URL)" >> $GITHUB_STEP_SUMMARY

      - name: Terraform Format & Lockfile Update
        working-directory: ./src/terraform/infrastructure
        run: |
          terraform fmt -recursive
          terraform init -lockfile=./.terraform.lock.hcl

      - name: Commit Formatting & Lockfile Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: terraform fmt and lockfile update"
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git push origin HEAD:main
          fi
