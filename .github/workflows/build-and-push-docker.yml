name: Build & Push Docker Images to Azure Container Registry

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
  ARM_CLIENT_ID:       ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
  ARM_CLIENT_SECRET:   ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
  ARM_TENANT_ID:       ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
  ACR_NAME:            ${{ secrets.ACR_NAME }}
  ACR_LOGIN_SERVER:    ${{ secrets.ACR_NAME }}.azurecr.io

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Docker Login to ACR
        run: |
          az acr login --name $ACR_NAME

      - name: Build & Push Frontend
        run: |
          docker build -t $ACR_LOGIN_SERVER/frontend:latest ./src/docker/frontend
          docker push $ACR_LOGIN_SERVER/frontend:latest

      - name: Build & Push Backend
        run: |
          docker build -t $ACR_LOGIN_SERVER/backend:latest ./src/docker/backend
          docker push $ACR_LOGIN_SERVER/backend:latest

      - name: Build & Push DB
        run: |
          docker build -t $ACR_LOGIN_SERVER/db:latest ./src/docker/db
          docker push $ACR_LOGIN_SERVER/db:latest
